name: Build MundoCuadro Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: gradle -p android --no-daemon assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MundoCuadro_REBORN_Android.apk
          sha256sum MundoCuadro_REBORN_Android.apk > MundoCuadro_REBORN_Android.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MundoCuadro_REBORN_Android_APK
          path: |
            MundoCuadro_REBORN_Android.apk
            MundoCuadro_REBORN_Android.apk.sha256
          if-no-files-found: error
          retention-days: 30
